<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WJEC Exam Style Graph Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arial&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .wjec-font {
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-container {
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .graph-wrapper {
                border: none !important;
                padding: 0 !important;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <header class="bg-slate-900 text-white p-4 shadow-md no-print">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 p-2 rounded-lg text-white font-bold text-xl tracking-wider">
                    WJEC
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-none">Exam Graph Generator</h1>
                    <p class="text-xs text-slate-400 mt-1">Generate official GCSE & A-Level Science style graph paper</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg flex items-center space-x-2 transition shadow-sm">
                    <i class="fa-solid fa-print"></i>
                    <span>Print / Save as PDF</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls Sidebar -->
        <aside class="lg:col-span-4 bg-white p-5 rounded-xl shadow-sm border border-slate-200 no-print space-y-6 h-fit">
            
            <div class="border-b border-slate-200 pb-3 flex justify-between items-center">
                <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> Graph Configuration
                </h2>
                <button onclick="resetDefaults()" class="text-xs text-indigo-600 hover:underline">Reset Defaults</button>
            </div>

            <!-- Y-Axis Configuration -->
            <div class="space-y-3 bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-up-down text-slate-500"></i> Y-Axis (Vertical)
                    </span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Label / Title (e.g. Air resistance (N))</label>
                    <input type="text" id="yLabel" value="Air resistance (N)" placeholder="Leave blank for none" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Start Value</label>
                        <input type="number" id="yStart" value="0" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Major Step</label>
                        <input type="number" id="yStep" value="200" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Numbers Display</label>
                    <select id="yMode" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="show">Show Numbers on Ticks</option>
                        <option value="blank">Blank Ticks Only (For Students)</option>
                        <option value="none">No Ticks or Numbers</option>
                    </select>
                </div>
            </div>

            <!-- X-Axis Configuration -->
            <div class="space-y-3 bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-left-right text-slate-500"></i> X-Axis (Horizontal)
                    </span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Label / Title (e.g. Distance fallen (m))</label>
                    <input type="text" id="xLabel" value="Distance fallen (m)" placeholder="Leave blank for none" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Start Value</label>
                        <input type="number" id="xStart" value="0" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Major Step</label>
                        <input type="number" id="xStep" value="250" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Numbers Display</label>
                    <select id="xMode" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="show">Show Numbers on Ticks</option>
                        <option value="blank">Blank Ticks Only (For Students)</option>
                        <option value="none">No Ticks or Numbers</option>
                    </select>
                </div>
            </div>

            <!-- Grid Dimensions -->
            <div class="space-y-3 bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                <span class="font-semibold text-slate-700 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-border-all text-slate-500"></i> Grid Layout
                </span>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Grid Aspect Ratio / Proportions</label>
                    <select id="gridMode" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="square" selected>Perfect Square Grid (Fixed Square Size)</option>
                        <option value="fit">Fit to Frame (Stretch Grid)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">X Major Blocks</label>
                        <input type="number" id="xBlocks" value="8" min="2" max="25" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Y Major Blocks</label>
                        <input type="number" id="yBlocks" value="5" min="2" max="25" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Subdivisions / Block</label>
                        <select id="subDivs" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="10" selected>10 x 10 (Standard WJEC 1mm/2mm)</option>
                            <option value="5">5 x 5</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Font Size (pt)</label>
                        <input type="number" id="fontSize" value="18" min="12" max="28" class="w-full text-sm px-3 py-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Optional Data Plotting -->
            <div class="space-y-3 bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                <div class="flex items-center justify-between">
                    <span class="font-semibold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-line text-slate-500"></i> Plot Data (Teacher Key)
                    </span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="enableData" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>

                <div id="dataPlotControls" class="space-y-3 hidden pt-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Data Points (X, Y per line)</label>
                        <textarea id="dataPoints" rows="4" class="w-full text-xs font-mono p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0, 0&#10;500, 350&#10;1000, 600&#10;1500, 800&#10;2000, 950">0, 0
500, 350
1000, 600
1500, 800
2000, 950</textarea>
                    </div>

                    <div class="flex justify-between items-center">
                        <label class="text-xs font-medium text-slate-600">Point Style</label>
                        <select id="pointStyle" class="text-xs px-2 py-1 border border-slate-300 rounded bg-white">
                            <option value="cross" selected>Cross (x)</option>
                            <option value="plus">Plus (+)</option>
                            <option value="circle">Circle (o)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Line Connection Type</label>
                        <select id="lineType" class="w-full text-xs px-2 py-1 border border-slate-300 rounded bg-white">
                            <option value="none">No Line (Points Only)</option>
                            <option value="straight" selected>Straight Line (Best Fit)</option>
                            <option value="curved">Curved Line (Smooth Trend)</option>
                            <option value="dottodot">Dot to Dot (Point to Point)</option>
                        </select>
                    </div>

                    <div class="flex justify-between items-center">
                        <label class="text-xs font-medium text-slate-600">Line Style</label>
                        <select id="lineStyle" class="text-xs px-2 py-1 border border-slate-300 rounded bg-white">
                            <option value="solid" selected>Solid (Official WJEC)</option>
                            <option value="dashed">Dashed</option>
                        </select>
                    </div>
                </div>
            </div>

        </aside>

        <section class="lg:col-span-8 flex flex-col items-center justify-start print-container">
            <div class="w-full bg-white p-4 md:p-8 rounded-xl shadow-sm border border-slate-200 graph-wrapper flex flex-col items-center justify-center min-h-[600px]">
                <!-- Interactive High-DPI Vector Graph -->
                <div class="w-full flex justify-center items-center overflow-auto">
                    <svg id="graphSvg" class="w-full h-auto max-w-full wjec-font" style="background: white;"></svg>
                </div>
            </div>
        </section>

    </main>

    <script>
        // DOM Elements
        const yLabelInput = document.getElementById('yLabel');
        const yStartInput = document.getElementById('yStart');
        const yStepInput = document.getElementById('yStep');
        const yModeInput = document.getElementById('yMode');

        const xLabelInput = document.getElementById('xLabel');
        const xStartInput = document.getElementById('xStart');
        const xStepInput = document.getElementById('xStep');
        const xModeInput = document.getElementById('xMode');

        const gridModeInput = document.getElementById('gridMode');
        const xBlocksInput = document.getElementById('xBlocks');
        const yBlocksInput = document.getElementById('yBlocks');
        const subDivsInput = document.getElementById('subDivs');
        const fontSizeInput = document.getElementById('fontSize');

        const enableDataInput = document.getElementById('enableData');
        const dataPlotControls = document.getElementById('dataPlotControls');
        const dataPointsInput = document.getElementById('dataPoints');
        const lineTypeInput = document.getElementById('lineType');
        const lineStyleInput = document.getElementById('lineStyle');
        const pointStyleInput = document.getElementById('pointStyle');

        const svg = document.getElementById('graphSvg');

        enableDataInput.addEventListener('change', () => {
            if (enableDataInput.checked) {
                dataPlotControls.classList.remove('hidden');
            } else {
                dataPlotControls.classList.add('hidden');
            }
            renderGraph();
        });

        const inputs = [
            yLabelInput, yStartInput, yStepInput, yModeInput,
            xLabelInput, xStartInput, xStepInput, xModeInput,
            gridModeInput, xBlocksInput, yBlocksInput, subDivsInput, fontSizeInput,
            dataPointsInput, lineTypeInput, lineStyleInput, pointStyleInput
        ];

        inputs.forEach(input => {
            input.addEventListener('input', renderGraph);
            input.addEventListener('change', renderGraph);
        });

        function resetDefaults() {
            yLabelInput.value = "Air resistance (N)";
            yStartInput.value = "0";
            yStepInput.value = "200";
            yModeInput.value = "show";

            xLabelInput.value = "Distance fallen (m)";
            xStartInput.value = "0";
            xStepInput.value = "250";
            xModeInput.value = "show";

            gridModeInput.value = "square";
            xBlocksInput.value = "8";
            yBlocksInput.value = "5";
            subDivsInput.value = "10";
            fontSizeInput.value = "18";

            enableDataInput.checked = false;
            dataPlotControls.classList.add('hidden');
            lineTypeInput.value = "straight";
            lineStyleInput.value = "solid";
            dataPointsInput.value = "0, 0\n500, 350\n1000, 600\n1500, 800\n2000, 950";

            renderGraph();
        }

        function renderGraph() {
            // Read configuration parameters
            const yLabel = yLabelInput.value.trim();
            const yStart = parseFloat(yStartInput.value) || 0;
            const yStep = parseFloat(yStepInput.value) || 0;
            const yMode = yModeInput.value;

            const xLabel = xLabelInput.value.trim();
            const xStart = parseFloat(xStartInput.value) || 0;
            const xStep = parseFloat(xStepInput.value) || 0;
            const xMode = xModeInput.value;

            const gridMode = gridModeInput.value;
            const xBlocks = Math.max(2, parseInt(xBlocksInput.value) || 8);
            const yBlocks = Math.max(2, parseInt(yBlocksInput.value) || 5);
            const subDivs = parseInt(subDivsInput.value) || 10;
            const fontSize = parseInt(fontSizeInput.value) || 18;

            // Page Margins
            const marginTop = 65;      
            const marginRight = 55;    
            const marginBottom = 75;   
            const marginLeft = 100;    

            let gridWidth, gridHeight, svgWidth, svgHeight;

            if (gridMode === "square") {
                const maxAvailableWidth = 745;
                const maxAvailableHeight = 540;

                const blockSize = Math.min(
                    maxAvailableWidth / xBlocks,
                    maxAvailableHeight / yBlocks
                );

                gridWidth = blockSize * xBlocks;
                gridHeight = blockSize * yBlocks;

                svgWidth = gridWidth + marginLeft + marginRight;
                svgHeight = gridHeight + marginTop + marginBottom;
            } else {
                svgWidth = 900;
                svgHeight = 680;
                gridWidth = svgWidth - marginLeft - marginRight;
                gridHeight = svgHeight - marginTop - marginBottom;
            }

            svg.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);

            const originX = marginLeft;
            const originY = marginTop + gridHeight;

            const totalXSubdivisions = xBlocks * subDivs;
            const totalYSubdivisions = yBlocks * subDivs;

            const xSubStep = gridWidth / totalXSubdivisions;
            const ySubStep = gridHeight / totalYSubdivisions;

            const xBlockStep = gridWidth / xBlocks;
            const yBlockStep = gridHeight / yBlocks;

            svg.innerHTML = '';

            // Arrowheads Setup
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            
            // Upwards pointing vertical arrowhead
            const markerY = document.createElementNS("http://www.w3.org/2000/svg", "marker");
            markerY.setAttribute("id", "arrowY");
            markerY.setAttribute("viewBox", "0 0 10 10");
            markerY.setAttribute("refX", "5");
            markerY.setAttribute("refY", "0");
            markerY.setAttribute("markerWidth", "9");
            markerY.setAttribute("markerHeight", "9");
            markerY.setAttribute("orient", "0");

            const pathY = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathY.setAttribute("d", "M 2 10 L 5 0 L 8 10 Z");
            pathY.setAttribute("fill", "#222222");
            markerY.appendChild(pathY);

            // Rightwards pointing horizontal arrowhead
            const markerX = document.createElementNS("http://www.w3.org/2000/svg", "marker");
            markerX.setAttribute("id", "arrowX");
            markerX.setAttribute("viewBox", "0 0 10 10");
            markerX.setAttribute("refX", "10");
            markerX.setAttribute("refY", "5");
            markerX.setAttribute("markerWidth", "9");
            markerX.setAttribute("markerHeight", "9");
            markerX.setAttribute("orient", "0");

            const pathX = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathX.setAttribute("d", "M 0 2 L 10 5 L 0 8 Z");
            pathX.setAttribute("fill", "#222222");
            markerX.appendChild(pathX);

            defs.appendChild(markerY);
            defs.appendChild(markerX);
            svg.appendChild(defs);

            const gridGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            gridGroup.setAttribute("id", "grid");

            // Tier 1: Smallest / Minor lines
            for (let i = 0; i <= totalXSubdivisions; i++) {
                if (i % subDivs !== 0 && (subDivs !== 10 || i % 5 !== 0)) {
                    const x = originX + i * xSubStep;
                    gridGroup.appendChild(createLine(x, originY, x, originY - gridHeight, "#c8cacd", "0.55"));
                }
            }
            for (let j = 0; j <= totalYSubdivisions; j++) {
                if (j % subDivs !== 0 && (subDivs !== 10 || j % 5 !== 0)) {
                    const y = originY - j * ySubStep;
                    gridGroup.appendChild(createLine(originX, y, originX + gridWidth, y, "#c8cacd", "0.55"));
                }
            }

            // Tier 2: Mid-tier lines
            if (subDivs === 10) {
                for (let i = 5; i < totalXSubdivisions; i += 10) {
                    const x = originX + i * xSubStep;
                    gridGroup.appendChild(createLine(x, originY, x, originY - gridHeight, "#a0a4a8", "0.85"));
                }
                for (let j = 5; j < totalYSubdivisions; j += 10) {
                    const y = originY - j * ySubStep;
                    gridGroup.appendChild(createLine(originX, y, originX + gridWidth, y, "#a0a4a8", "0.85"));
                }
            }

            // Tier 3: Major grid lines
            for (let i = 0; i <= xBlocks; i++) {
                const x = originX + i * xBlockStep;
                gridGroup.appendChild(createLine(x, originY, x, originY - gridHeight, "#555b62", "1.4"));
            }
            for (let j = 0; j <= yBlocks; j++) {
                const y = originY - j * yBlockStep;
                gridGroup.appendChild(createLine(originX, y, originX + gridWidth, y, "#555b62", "1.4"));
            }

            svg.appendChild(gridGroup);

            const axesGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            axesGroup.setAttribute("id", "axes");

            const arrowExtension = 22;

            // Y-Axis
            const yAxis = createLine(originX, originY, originX, originY - gridHeight - arrowExtension, "#111111", "2.2");
            yAxis.setAttribute("marker-end", "url(#arrowY)");
            axesGroup.appendChild(yAxis);

            // X-Axis
            const xAxis = createLine(originX, originY, originX + gridWidth + arrowExtension, originY, "#111111", "2.2");
            xAxis.setAttribute("marker-end", "url(#arrowX)");
            axesGroup.appendChild(xAxis);

            svg.appendChild(axesGroup);

            const labelsGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            labelsGroup.setAttribute("id", "labels");

            // Y-Axis Ticks & Values
            for (let j = 0; j <= yBlocks; j++) {
                const y = originY - j * yBlockStep;
                labelsGroup.appendChild(createLine(originX - 7, y, originX, y, "#111111", "2.0"));

                if (yMode === "show") {
                    const val = yStart + (j * yStep);
                    const valStr = Number.isInteger(val) ? val.toString() : val.toFixed(1);

                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", (originX - 12).toString());
                    text.setAttribute("y", (y + (fontSize * 0.32)).toString());
                    text.setAttribute("text-anchor", "end");
                    text.setAttribute("font-size", `${fontSize}px`);
                    text.setAttribute("fill", "#000000");
                    text.textContent = valStr;
                    labelsGroup.appendChild(text);
                }
            }

            // X-Axis Ticks & Values
            for (let i = 0; i <= xBlocks; i++) {
                const x = originX + i * xBlockStep;
                labelsGroup.appendChild(createLine(x, originY, x, originY + 7, "#111111", "2.0"));

                if (xMode === "show") {
                    const val = xStart + (i * xStep);
                    const valStr = Number.isInteger(val) ? val.toString() : val.toFixed(1);

                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", x.toString());
                    text.setAttribute("y", (originY + fontSize + 8).toString());
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("font-size", `${fontSize}px`);
                    text.setAttribute("fill", "#000000");
                    text.textContent = valStr;
                    labelsGroup.appendChild(text);
                }
            }

            // Titles
            if (yLabel) {
                const yTitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
                yTitle.setAttribute("x", (originX - 85).toString());
                yTitle.setAttribute("y", (originY - gridHeight - 38).toString());
                yTitle.setAttribute("text-anchor", "start");
                yTitle.setAttribute("font-size", `${fontSize + 1}px`);
                yTitle.setAttribute("fill", "#000000");
                yTitle.textContent = yLabel;
                labelsGroup.appendChild(yTitle);
            }

            if (xLabel) {
                const xTitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
                xTitle.setAttribute("x", (originX + gridWidth + 10).toString());
                xTitle.setAttribute("y", (originY + fontSize + 36).toString());
                xTitle.setAttribute("text-anchor", "end");
                xTitle.setAttribute("font-size", `${fontSize + 1}px`);
                xTitle.setAttribute("fill", "#000000");
                xTitle.textContent = xLabel;
                labelsGroup.appendChild(xTitle);
            }

            svg.appendChild(labelsGroup);

            if (enableDataInput.checked) {
                const dataGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                dataGroup.setAttribute("id", "dataPlot");

                const rawText = dataPointsInput.value.trim();
                const lines = rawText.split('\n');
                let parsedPoints = [];

                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length === 2) {
                        const px = parseFloat(parts[0].trim());
                        const py = parseFloat(parts[1].trim());
                        if (!isNaN(px) && !isNaN(py)) {
                            parsedPoints.push({ x: px, y: py });
                        }
                    }
                });

                const yMax = yStart + (yBlocks * yStep);
                const xMax = xStart + (xBlocks * xStep);

                const getCanvasCoords = (pt) => {
                    const xPx = originX + ((pt.x - xStart) / (xMax - xStart)) * gridWidth;
                    const yPx = originY - ((pt.y - yStart) / (yMax - yStart)) * gridHeight;
                    return { x: xPx, y: yPx };
                };

                const pointStyle = pointStyleInput.value;
                const lineType = lineTypeInput.value;
                const lineStyle = lineStyleInput.value;

                // Sort points by X for line drawing algorithms
                parsedPoints.sort((a, b) => a.x - b.x);

                // 1. Draw connecting line according to selected lineType
                if (parsedPoints.length >= 2 && lineType !== "none") {
                    const lineStroke = "#111111"; // Official dark exam line color
                    const strokeWidth = "2.6";
                    const dashArray = lineStyle === "dashed" ? "8,5" : "none";

                    if (lineType === "straight") {
                        // Linear regression (Line of best fit)
                        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                        const n = parsedPoints.length;

                        parsedPoints.forEach(p => {
                            sumX += p.x;
                            sumY += p.y;
                            sumXY += (p.x * p.y);
                            sumXX += (p.x * p.x);
                        });

                        const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                        const intercept = (sumY - slope * sumX) / n;

                        if (!isNaN(slope) && !isNaN(intercept)) {
                            const minDataX = parsedPoints[0].x;
                            const maxDataX = parsedPoints[parsedPoints.length - 1].x;

                            const startFitY = slope * minDataX + intercept;
                            const endFitY = slope * maxDataX + intercept;

                            const startCoords = getCanvasCoords({ x: minDataX, y: startFitY });
                            const endCoords = getCanvasCoords({ x: maxDataX, y: endFitY });

                            const fitLine = createLine(startCoords.x, startCoords.y, endCoords.x, endCoords.y, lineStroke, strokeWidth);
                            if (dashArray !== "none") fitLine.setAttribute("stroke-dasharray", dashArray);
                            dataGroup.appendChild(fitLine);
                        }
                    } else if (lineType === "dottodot") {
                        // Dot to Dot (Point to Point polyline)
                        let pathD = "";
                        parsedPoints.forEach((p, idx) => {
                            const coords = getCanvasCoords(p);
                            if (idx === 0) {
                                pathD += `M ${coords.x} ${coords.y}`;
                            } else {
                                pathD += ` L ${coords.x} ${coords.y}`;
                            }
                        });

                        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        polyline.setAttribute("d", pathD);
                        polyline.setAttribute("fill", "none");
                        polyline.setAttribute("stroke", lineStroke);
                        polyline.setAttribute("stroke-width", strokeWidth);
                        if (dashArray !== "none") polyline.setAttribute("stroke-dasharray", dashArray);
                        dataGroup.appendChild(polyline);
                    } else if (lineType === "curved") {
                        // Smooth Spline Curve through points
                        const coordsList = parsedPoints.map(p => getCanvasCoords(p));
                        
                        let pathD = `M ${coordsList[0].x} ${coordsList[0].y}`;
                        
                        if (coordsList.length === 2) {
                            pathD += ` L ${coordsList[1].x} ${coordsList[1].y}`;
                        } else {
                            // Catmull-Rom or smooth cubic bezier fitting
                            for (let i = 0; i < coordsList.length - 1; i++) {
                                const p0 = coordsList[i === 0 ? i : i - 1];
                                const p1 = coordsList[i];
                                const p2 = coordsList[i + 1];
                                const p3 = coordsList[i + 2 < coordsList.length ? i + 2 : i + 1];

                                const cp1x = p1.x + (p2.x - p0.x) / 6;
                                const cp1y = p1.y + (p2.y - p0.y) / 6;
                                const cp2x = p2.x - (p3.x - p1.x) / 6;
                                const cp2y = p2.y - (p3.y - p1.y) / 6;

                                pathD += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
                            }
                        }

                        const curvePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        curvePath.setAttribute("d", pathD);
                        curvePath.setAttribute("fill", "none");
                        curvePath.setAttribute("stroke", lineStroke);
                        curvePath.setAttribute("stroke-width", strokeWidth);
                        if (dashArray !== "none") curvePath.setAttribute("stroke-dasharray", dashArray);
                        dataGroup.appendChild(curvePath);
                    }
                }

                // 2. Draw Data Points (Crosses, Pluses, Circles)
                parsedPoints.forEach(pt => {
                    const coords = getCanvasCoords(pt);
                    
                    if (coords.x >= originX - 5 && coords.x <= originX + gridWidth + 5 &&
                        coords.y <= originY + 5 && coords.y >= originY - gridHeight - 5) {
                        
                        const size = 6;
                        if (pointStyle === "cross") {
                            dataGroup.appendChild(createLine(coords.x - size, coords.y - size, coords.x + size, coords.y + size, "#000000", "2.2"));
                            dataGroup.appendChild(createLine(coords.x - size, coords.y + size, coords.x + size, coords.y - size, "#000000", "2.2"));
                        } else if (pointStyle === "plus") {
                            dataGroup.appendChild(createLine(coords.x - size, coords.y, coords.x + size, coords.y, "#000000", "2.2"));
                            dataGroup.appendChild(createLine(coords.x, coords.y - size, coords.x, coords.y + size, "#000000", "2.2"));
                        } else {
                            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                            circle.setAttribute("cx", coords.x.toString());
                            circle.setAttribute("cy", coords.y.toString());
                            circle.setAttribute("r", "4");
                            circle.setAttribute("fill", "#ffffff");
                            circle.setAttribute("stroke", "#000000");
                            circle.setAttribute("stroke-width", "2");
                            dataGroup.appendChild(circle);
                        }
                    }
                });

                svg.appendChild(dataGroup);
            }
        }

        function createLine(x1, y1, x2, y2, strokeColor, strokeWidth) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1.toString());
            line.setAttribute("y1", y1.toString());
            line.setAttribute("x2", x2.toString());
            line.setAttribute("y2", y2.toString());
            line.setAttribute("stroke", strokeColor);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("shape-rendering", "crispEdges");
            return line;
        }

        // Initial render on page load
        window.onload = function() {
            renderGraph();
        };
    </script>
</body>
